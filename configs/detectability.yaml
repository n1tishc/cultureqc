# Evidence-backed detectability matrix (cultureQC_upgrade_specv4.md §2B.5, B4).
# Shown in the app (demo/app.py, "Detectability" tab); its SHA-256 is recorded in
# every analysis record and visit summary (config_hashes["detectability.yaml"]).
# Every evidence cell cites a Phase A check (V-number) or a results/tests file,
# or says "not tested". Numbers are copied from the files named, not re-derived.
version: 1
tested_setup: >-
  Replayed C2C12 time-lapse (Ker et al. 2018, CC BY 4.0; real images, simulated
  visits and faults): 0.25-frac fields of view, 1–3 per visit, visits every 6–12 h,
  5× objective at 1.3 µm/px. Not RoboCell images.
provenance_note: >-
  Simulated faults are drawn onto recorded frames. The contamination simulation
  pastes bacterial images from DeepBacs (79 nm/px) pixel-for-pixel into 1.3 µm/px
  frames, so the bacteria are 16.5× too long; it is an exaggerated-scale stress test.
rows:
  - issue: Bacterial contamination
    detectable_here: >-
      Not detected with simulated bacteria at real size, up to 400 per 256 px tile
      area (per-visit flag at chance; heavier contamination not tested); caught per
      visit only in an exaggerated-scale simulation
    evidence: >-
      At realistic size (results/contamination_scale.md, simulated, 4 sequences,
      up to 400 bacteria per 256 px tile area): held-out AUROC 0.48; flag on 1 of
      97 frames, against 4 of 97 for the same frames without bacteria; the quality gate
      fails no more often than without them; confluency reads a median 4.3 pp lower.
      Simulated at 16.5× real size,
      V5(b): AUROC 1.00 at ≥ 150 sprites per tile area, n = 2 held-out sequences
      (results/anomaly_summary.md); the quality gate fails 91.8% of those frames
      (results/quality_gate_c2c12.md)
    confirm_with: Culture / Gram stain / PCR
  - issue: Yeast / fungi
    detectable_here: Not tested
    evidence: Not tested (no yeast or fungal images, real or simulated)
    confirm_with: Culture
  - issue: Growth stall / slowdown
    detectable_here: No, at the tested setup
    evidence: >-
      V2: one visit's growth is 0.35–1.12× the field-to-field noise, 2× needed;
      V6: 0 of 2 simulated stalls flagged (results/growth_signal_summary.md,
      results/spc_summary.md)
    confirm_with: Cell count
  - issue: Detachment
    detectable_here: Not tested on real images
    evidence: >-
      V5(a): stand-in scorer on synthetic tiles only, AUROC 0.82
      (results/anomaly_summary.md); the QC classifier does not transfer to C2C12
      (B0, results/classifier_scale_test.md)
    confirm_with: Visual inspection
  - issue: Instrument drift (illumination)
    detectable_here: Not reliably
    evidence: >-
      V7(b) fail: the held-out normal fleet also raised the drift state
      (results/drift_summary.md); the quality gate fails 51.1% of simulated
      dimmed frames, as re-image requests (results/quality_gate_c2c12.md)
    confirm_with: Instrument QC
  - issue: Image quality (blur / exposure / uneven illumination)
    detectable_here: Yes, by the quality gate
    evidence: >-
      Quality gate: blurred, dark and uneven test images fail (tests/test_quality.py);
      on held-out C2C12 it also fails 12.1% of normal frames
      (results/quality_gate_c2c12.md)
    confirm_with: Re-image
  - issue: Mycoplasma
    detectable_here: "No"
    evidence: Not optically detectable in brightfield or phase contrast
    confirm_with: PCR / indicator-cell assay
