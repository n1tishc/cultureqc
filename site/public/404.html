<html lang="en">
<head>

<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<link rel="icon" type="image/png" href="/favicon.png">
<style>
  /* Served as-is from public/ (not through the bundle), so the site's tokens are restated here. */
  :root { --paper: #f5f6f8; --ink: #0d1117; --ink-2: #353e4a; --ink-3: #56616e; --rule-2: #c8cfd7; --panel: #ffffff; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
         background: var(--paper); color: var(--ink); font: 400 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 560px; }
  .code { font: 500 13px/1 ui-monospace, "SF Mono", Menlo, monospace; color: var(--ink-3); letter-spacing: 0.04em; }
  h1 { margin: 12px 0 10px; font-size: clamp(30px, 6vw, 44px); line-height: 1.05; letter-spacing: -0.03em; font-weight: 640; }
  p { margin: 0 0 22px; color: var(--ink-2); }
  nav { display: flex; flex-wrap: wrap; gap: 8px; }
  a { color: var(--ink); text-decoration: none; padding: 8px 14px; border: 1px solid var(--rule-2); border-radius: 999px; background: var(--panel); font-size: 14px; }
  a:hover { border-color: var(--ink-3); }
  a.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
</style>
</head>

<main>
