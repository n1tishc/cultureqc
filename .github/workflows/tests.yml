name: tests

on:
  push:
    # The upgrade branch is tested on every push until it merges (owner's call).
    branches: [main, slice-1b-compute-cache]
  pull_request:
  workflow_dispatch:

jobs:
  api:
    name: API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Deliberately not requirements.txt. The contract suite stubs the models,
      # so it needs no torch and no cellpose — installing them would turn a
      # 40-second job into a five-minute one to exercise nothing extra.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install fastapi 'python-multipart' httpx pytest numpy Pillow pyyaml opencv-python-headless

      - name: Contract tests
        run: python -m pytest deploy/hf-space/test_api.py -q

      # The Space carries generated copies of culture/ and config/. If they drift,
      # the deployed pipeline stops being the one in this repo — silently.
      - name: Space is in sync with the repo
        run: python deploy/sync_space.py --check

  python:
    name: Python tests (no model weights, no cache)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # No torch, cellpose or gradio, and no compute cache: tests that need one
      # skip with a stated reason (tests/conftest.py). The full suite, with the
      # models and the cache, runs locally; docs/STATUS.md says what CI covers.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy pandas pyarrow pyyaml scipy scikit-image opencv-python-headless Pillow matplotlib plotly tqdm jsonschema

      - name: Tests
        run: python -m pytest tests -q -rs

  site:
    name: Site build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Record chain verifies in the browser code
        run: node --test site/tests/verify.test.js

      - name: Build
        run: npm run build

      # site/src/data.json is generated from the repo's own output (examples,
      # records, replays, detectability matrix, README tables). If someone
      # hand-edits it, the page stops matching the records it shows.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Page data matches the repo output it came from
        run: |
          pip install numpy pyyaml
          python site/assets/build_data.py
          git diff --exit-code -- site/src/data.json
