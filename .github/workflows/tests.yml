name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  api:
    name: API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Deliberately not requirements.txt. The contract suite stubs the models,
      # so it needs no torch and no cellpose — installing them would turn a
      # 40-second job into a five-minute one to exercise nothing extra.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install fastapi 'python-multipart' httpx pytest numpy Pillow pyyaml opencv-python-headless

      - name: Contract tests
        run: python -m pytest deploy/hf-space/test_api.py -q

      # The Space carries generated copies of culture/ and config/. If they drift,
      # the deployed pipeline stops being the one in this repo — silently.
      - name: Space is in sync with the repo
        run: python deploy/sync_space.py --check

  site:
    name: Site build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # site/src/data.json is generated from the pipeline output committed under
      # site/assets/. If someone hand-edits the JSON, the page stops matching the
      # records it claims to show — which is the one thing this page must not do.
      - name: Reference data matches the pipeline output it came from
        run: |
          python3 site/assets/build_data.py
          git diff --exit-code -- site/src/data.json site/public/img
